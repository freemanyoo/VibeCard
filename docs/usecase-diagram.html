<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VibeCard Optimized Use Case Diagram</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: WhiteSmoke;
      font-family: "Pretendard", -apple-system, sans-serif;
      overflow: auto;
    }
    /* 가로로 긴 보드 설정 */
    .board {
      position: relative;
      width: 2400px;
      height: 1200px;
      background: white;
      margin: 40px auto;
      border: 1px solid LightGray;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    /* 행위자 스타일 */
    .actor {
      position: absolute;
      width: 160px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      border-radius: 8px;
      background: White;
      border: 2px solid SlateGray;
      z-index: 10;
    }
    /* 유스케이스(타원) 스타일 */
    .uc {
      position: absolute;
      width: 200px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: 600;
      font-size: 14px;
      border-radius: 50%;
      border: 2px solid Gray;
      background: White;
      padding: 10px;
      z-index: 5;
    }

    /* 컬러 전략 적용 (헥사코드 제외) */
    .auth { background-color: AliceBlue; border-color: RoyalBlue; color: MidnightBlue; }
    .manage { background-color: AntiqueWhite; border-color: Chocolate; color: SaddleBrown; }
    .public { background-color: Honeydew; border-color: ForestGreen; color: DarkGreen; }
    .ai-tech { background-color: GhostWhite; border-color: MediumPurple; color: Indigo; }
    .admin-sys { background-color: LavenderBlush; border-color: Crimson; color: DarkRed; }

    /* 위치 설정 (가로 흐름) */
    .left-actor { left: 50px; }
    .right-actor { left: 2190px; }

    /* 열 배치 */
    .col-1 { left: 300px; }  /* 인증 */
    .col-2 { left: 650px; }  /* 제작 */
    .col-3 { left: 1000px; } /* 업로드/목록 */
    .col-4 { left: 1350px; } /* 조회/참석 */
    .col-5 { left: 1700px; } /* AI/방명록 */
    .col-6 { left: 2050px; } /* 관리자 전용 */

    .edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  </style>
</head>
<body>
  <div class="board">
    <svg class="edges" viewBox="0 0 2400 1200">
      <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="Gray" />
        </marker>
      </defs>
      <g stroke="LightSteelBlue" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
        <path d="M210,400 L300,200" /> <path d="M210,400 L300,300" />
        <path d="M210,400 L650,200" /> <path d="M210,400 L650,300" />
        <path d="M210,700 L1350,600" /> <path d="M210,700 L1350,700" />
        <path d="M500,200 L2190,400" /> <path d="M1900,200 L2190,700" />
      </g>
    </svg>

    <div class="actor left-actor" style="top: 370px;">회원 사용자</div>
    <div class="actor left-actor" style="top: 670px;">비회원 방문자</div>
    <div class="actor left-actor" style="top: 970px;">관리자</div>
    <div class="actor right-actor" style="top: 370px;">소셜 제공자</div>
    <div class="actor right-actor" style="top: 670px;">AI 서비스</div>

    <div class="uc col-1 auth" style="top: 165px;">회원가입</div>
    <div class="uc col-1 auth" style="top: 265px;">로그인</div>

    <div class="uc col-2 manage" style="top: 165px;">청첩장 생성</div>
    <div class="uc col-2 manage" style="top: 265px;">청첩장 수정</div>
    <div class="uc col-3 manage" style="top: 165px;">이미지 업로드</div>
    <div class="uc col-3 manage" style="top: 265px;">목록 조회</div>

    <div class="uc col-4 public" style="top: 565px;">청첩장 공개 조회</div>
    <div class="uc col-4 public" style="top: 665px;">참석 여부 제출</div>
    <div class="uc col-5 public" style="top: 565px;">방명록 작성</div>
    <div class="uc col-5 public" style="top: 665px;">계좌 정보 복사</div>

    <div class="uc col-5 ai-tech" style="top: 165px;">AI 스킨 생성</div>
    <div class="uc col-5 ai-tech" style="top: 265px;">AI 디자인 생성</div>

    <div class="uc col-6 admin-sys" style="top: 935px;">관리자 스킨 관리</div>
    <div class="uc col-6 admin-sys" style="top: 1035px;">악성 프롬프트 로그</div>
  </div>
</body>
</html>
