services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: ${POSTGRES_CONTAINER_NAME:-vibecard-postgres}
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vibecard}
      POSTGRES_USER: ${POSTGRES_USER:-vibecard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - ${POSTGRES_DATA_PATH:-/volume1/docker/vibecard/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vibecard} -d ${POSTGRES_DB:-vibecard}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-fast:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    container_name: ${MINIO_FAST_CONTAINER_NAME:-vibecard-minio-fast}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_FAST_ACCESS_KEY:-miniofast}
      MINIO_ROOT_PASSWORD: ${MINIO_FAST_SECRET_KEY:-change-me-fast}
    ports:
      - "${MINIO_FAST_API_PORT:-9000}:9000"
      - "${MINIO_FAST_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ${MINIO_FAST_DATA_PATH:-/volume5/ssd_docker/vibecard/minio-fast}:/data

  minio-cold:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    container_name: ${MINIO_COLD_CONTAINER_NAME:-vibecard-minio-cold}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_COLD_ACCESS_KEY:-miniocold}
      MINIO_ROOT_PASSWORD: ${MINIO_COLD_SECRET_KEY:-change-me-cold}
    ports:
      - "${MINIO_COLD_API_PORT:-9100}:9000"
      - "${MINIO_COLD_CONSOLE_PORT:-9101}:9001"
    volumes:
      - ${MINIO_COLD_DATA_PATH:-/volume1/docker/vibecard/minio-cold}:/data

  backend:
    image: ${BACKEND_IMAGE:-eclipse-temurin:17-jre}
    container_name: ${BACKEND_CONTAINER_NAME:-vibecard-backend}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app
    command: ["java", "-jar", "/app/app.jar"]
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/vibecard}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-vibecard}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-change-me}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      MINIO_FAST_ENDPOINT: ${MINIO_FAST_ENDPOINT:-http://minio-fast:9000}
      MINIO_FAST_PUBLIC_BASE_URL: ${MINIO_FAST_PUBLIC_BASE_URL:-https://your-domain.example/minio-fast}
      MINIO_FAST_ACCESS_KEY: ${MINIO_FAST_ACCESS_KEY:-miniofast}
      MINIO_FAST_SECRET_KEY: ${MINIO_FAST_SECRET_KEY:-change-me-fast}
      MINIO_FAST_BUCKET: ${MINIO_FAST_BUCKET:-vibecard-fast}
      MINIO_COLD_ENDPOINT: ${MINIO_COLD_ENDPOINT:-http://minio-cold:9000}
      MINIO_COLD_PUBLIC_BASE_URL: ${MINIO_COLD_PUBLIC_BASE_URL:-https://your-domain.example/minio-cold}
      MINIO_COLD_ACCESS_KEY: ${MINIO_COLD_ACCESS_KEY:-miniocold}
      MINIO_COLD_SECRET_KEY: ${MINIO_COLD_SECRET_KEY:-change-me-cold}
      MINIO_COLD_BUCKET: ${MINIO_COLD_BUCKET:-vibecard-cold}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      OPENCLAW_BASE_URL: ${OPENCLAW_BASE_URL:-}
      OPENCLAW_AUTH_TYPE: ${OPENCLAW_AUTH_TYPE:-bearer}
      OPENCLAW_AUTH_HEADER: ${OPENCLAW_AUTH_HEADER:-Authorization}
      OPENCLAW_AUTH_TOKEN: ${OPENCLAW_AUTH_TOKEN:-}
      OPENCLAW_AUTH_TOKEN_OPENCLAW1: ${OPENCLAW_AUTH_TOKEN_OPENCLAW1:-}
      OPENCLAW_AUTH_TOKEN_OPENCLAW2: ${OPENCLAW_AUTH_TOKEN_OPENCLAW2:-}
      OPENCLAW_AUTH_TOKEN_OPENCLAW3: ${OPENCLAW_AUTH_TOKEN_OPENCLAW3:-}
      OPENCLAW_MODE: ${OPENCLAW_MODE:-multi_endpoint}
      OPENCLAW_CHAT_PATH: ${OPENCLAW_CHAT_PATH:-/v1/chat/completions}
      OPENCLAW_MODEL_OPENCLAW1: ${OPENCLAW_MODEL_OPENCLAW1:-}
      OPENCLAW_MODEL_OPENCLAW2: ${OPENCLAW_MODEL_OPENCLAW2:-}
      OPENCLAW_MODEL_OPENCLAW3: ${OPENCLAW_MODEL_OPENCLAW3:-}
      OPENCLAW_MODEL_OPENCLAW3_GENERAL: ${OPENCLAW_MODEL_OPENCLAW3_GENERAL:-}
      OPENCLAW_MODEL_OPENCLAW3_CODING: ${OPENCLAW_MODEL_OPENCLAW3_CODING:-}
      OPENCLAW_MODEL_OPENCLAW3_VISION: ${OPENCLAW_MODEL_OPENCLAW3_VISION:-}
      OPENCLAW_OLLAMA_URL_OPENCLAW3: ${OPENCLAW_OLLAMA_URL_OPENCLAW3:-}
      OPENCLAW_OLLAMA_UNLOAD_AFTER_VISION: ${OPENCLAW_OLLAMA_UNLOAD_AFTER_VISION:-true}
      OPENCLAW_URL_OPENCLAW1: ${OPENCLAW_URL_OPENCLAW1:-}
      OPENCLAW_URL_OPENCLAW2: ${OPENCLAW_URL_OPENCLAW2:-}
      OPENCLAW_URL_OPENCLAW3: ${OPENCLAW_URL_OPENCLAW3:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-gpt-4.1-mini}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ${BACKEND_JAR_PATH:-/volume1/VibeCard/backend/app.jar}:/app/app.jar:ro
      - ${BACKEND_UPLOADS_PATH:-/volume1/docker/vibecard/backend/uploads}:/app/uploads
